<!doctype html>
<html lang="en" class="dark h-full bg-navy-950">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Smart CRM | Meta Ads & Operations Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="h-full bg-navy-950 text-slate-100 antialiased selection:bg-brand-600 selection:text-white overflow-hidden">
    <div id="root" class="h-full w-full">
      <!-- Instant HTML & CSS Preloader with logo.png -->
      <div style="height: 100vh; width: 100vw; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; position: relative; overflow: hidden; margin: 0; user-select: none;">
        <style>
          @keyframes preloader-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
          @keyframes preloader-pulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.04); }
          }
          @keyframes preloader-bar {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(35%); }
            100% { transform: translateX(200%); }
          }
          .preloader-glow-1 {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: rgba(124, 58, 237, 0.16);
            filter: blur(90px);
            top: 15%;
            left: 20%;
            pointer-events: none;
          }
          .preloader-glow-2 {
            position: absolute;
            width: 380px;
            height: 380px;
            border-radius: 50%;
            background: rgba(6, 182, 212, 0.16);
            filter: blur(90px);
            bottom: 15%;
            right: 20%;
            pointer-events: none;
          }
          .preloader-ring {
            width: 100px;
            height: 100px;
            border-radius: 22px;
            padding: 2.5px;
            background: linear-gradient(135deg, #7C3AED 0%, #6366F1 50%, #06B6D4 100%);
            animation: preloader-spin 2s linear infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(124, 58, 237, 0.35);
          }
          .preloader-inner {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            background: #030712;
          }
          .preloader-logo-box {
            position: absolute;
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid rgba(148, 163, 184, 0.25);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            animation: preloader-pulse 2s ease-in-out infinite;
          }
          .preloader-bar-track {
            width: 190px;
            height: 4px;
            background: rgba(30, 41, 59, 0.85);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 24px;
            position: relative;
            border: 1px solid rgba(51, 65, 85, 0.4);
          }
          .preloader-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #7C3AED, #06B6D4);
            animation: preloader-bar 1.6s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
          }
        </style>
        
        <div class="preloader-glow-1"></div>
        <div class="preloader-glow-2"></div>
        
        <div style="position: relative; display: flex; align-items: center; justify-content: center; margin-bottom: 24px;">
          <div class="preloader-ring">
            <div class="preloader-inner"></div>
          </div>
          <div class="preloader-logo-box">
            <img src="/logo.png" alt="Meta CRM" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
        </div>

        <div style="color: #F8FAFC; font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 6px;">
          Meta CRM Operations
        </div>
        <div style="color: #94A3B8; font-size: 12px; font-family: monospace; letter-spacing: 0.05em;">
          Initializing Command Center...
        </div>

        <div class="preloader-bar-track">
          <div class="preloader-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
